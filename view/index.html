<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF Viewer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{margin:0;background:#1e1e1e}
#pages{display:flex;flex-direction:column;align-items:center;padding:40px;gap:40px}
canvas{background:white;box-shadow:0 10px 20px rgba(0,0,0,.5)}
</style>

</head>

<body>

<div id="pages"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const pages = document.getElementById("pages");

function getBase64Url(){

const parts = window.location.pathname.split("/");

return parts[2];

}

const encoded = getBase64Url();
const PDF_URL = "/api/pdf/" + encoded;

async function init(){

const pdf = await pdfjsLib.getDocument(PDF_URL).promise;

for(let i=1;i<=pdf.numPages;i++){

const page = await pdf.getPage(i);
const viewport = page.getViewport({scale:1.2});

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

canvas.width = viewport.width;
canvas.height = viewport.height;

pages.appendChild(canvas);

await page.render({
canvasContext:ctx,
viewport
}).promise;

}

}

init();

</script>

</body>
</html>
